name: Compilar APK (IroDL)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      - name: Generar iconos de launcher
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Compilar APK release
        working-directory: app
        run: flutter build apk --release

      - name: Renombrar artefacto
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/IroDL-1.0.0.apk
          ls -la dist

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: IroDL-APK
          path: dist/IroDL-1.0.0.apk

      - name: Publicar en GitHub Releases (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IroDL-1.0.0.apk
